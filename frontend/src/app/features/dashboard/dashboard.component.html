<div class="dashboard">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Welcome, {{ auth.username() }}</mat-card-title>
      <mat-card-subtitle>Employee Management Dashboard</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Auth is working. Next we'll add Employees CRUD and Reports.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/login" (click)="auth.logout(); $event.preventDefault()">Logout</a>
    </mat-card-actions>
  </mat-card>
</div>
