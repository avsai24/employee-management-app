<div class="dashboard">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Welcome, {{ auth.username() }}</mat-card-title>
      <mat-card-subtitle>Employee Management Dashboard</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Manage employees, then open Reports for filtered views and Excel/PDF export.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button color="primary" routerLink="/employees">Employees</a>
      <a mat-stroked-button routerLink="/reports">Reports</a>
    </mat-card-actions>
  </mat-card>
</div>
